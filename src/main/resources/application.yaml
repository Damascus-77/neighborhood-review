server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: neighborhood-review
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: neighborhood-review
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'
mybatis-plus:
  type-aliases-package: com.zwh.neighborhood.entity
logging:
  level:
    com.zwh.neighborhood: ${LOG_LEVEL:info}
hmdp:
  cache:
    voucher-list:
      mode: ${VOUCHER_CACHE_MODE:mysql}
      refresh-after-write: 5s
      expire-after-write: 10m
      redis-ttl: 30m
